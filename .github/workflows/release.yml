name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Check out main (not the detached tag) so the updated manifest.json can be
      # committed back. Create release tags on main's HEAD so this is the same code.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install jprm
        run: python -m pip install --upgrade jprm

      - name: Resolve versions
        id: v
        run: |
          TAG="${GITHUB_REF#refs/tags/}"   # e.g. v1.1.0
          VERSION="${TAG#v}.0"             # e.g. 1.1.0.0 (4-part, Jellyfin convention)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG  Version: $VERSION"

      # jprm builds via `dotnet publish`, embeds a meta.json generated from
      # build.yaml, and prints the resulting zip path on stdout.
      - name: Build plugin zip
        id: build
        run: |
          mkdir -p ./artifacts
          zipfile=$(jprm --verbosity=debug plugin build ./Jellyfin.Plugin.PreviewSegment \
            --output=./artifacts --version="${{ steps.v.outputs.version }}" | tail -n1)
          echo "Built: $zipfile"
          echo "zipfile=$zipfile" >> "$GITHUB_OUTPUT"

      # Appends a version entry to manifest.json with the GitHub-release download
      # URL as sourceUrl and the zip's MD5 as checksum (what Jellyfin verifies).
      # Use --plugin-url (full flat URL) rather than --url, which would insert a
      # per-plugin slug subdirectory that GitHub release assets don't have.
      - name: Add version to repository manifest
        run: |
          zipname=$(basename "${{ steps.build.outputs.zipfile }}")
          jprm --verbosity=debug repo add \
            --plugin-url="https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/$zipname" \
            ./manifest.json "${{ steps.build.outputs.zipfile }}"
          echo "----- manifest.json -----"
          cat ./manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.zipfile }}
          body: |
            ## Preview Segment ${{ steps.v.outputs.tag }}

            ### Install via the plugin repository (recommended)

            In Jellyfin, go to **Dashboard → Plugins → Repositories** and add:

            ```
            https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json
            ```

            Then install **Preview Segment** from **Catalog**. Future updates are
            applied automatically by the "Update Plugins" scheduled task.

            ### Manual install (fallback)

            Download the attached zip, extract it, and copy the
            `Jellyfin.Plugin.PreviewSegment` folder (DLL + `meta.json`) into your
            Jellyfin `plugins/` directory, then restart Jellyfin.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Persist the updated manifest so the repository URL serves the new version.
      # Requires main to allow pushes from github-actions (see RELEASE_GUIDE.md).
      - name: Commit updated manifest to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- manifest.json; then
            echo "manifest.json unchanged, nothing to commit."
          else
            git add manifest.json
            git commit -m "Update manifest for ${{ steps.v.outputs.tag }}"
            git push origin HEAD:main
          fi
